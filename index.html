    <style>
      :root {
        --newsprint-bg: #F9F9F7;
        --newsprint-ink: #111111;
        --newsprint-divider: #E5E5E0;
        --newsprint-red: #CC0000;
      }

      * {
        border-radius: 0 !important;
      }

      html {

        scroll-padding-top: 80px;
        -ms-overflow-style: none;

      /* Hard Offset Newspaper Cutout Shadow */
      .hard-shadow {
        box-shadow: 4px 4px 0px 0px #111111;
      }
      .hard-shadow-sm {
        box-shadow: 2px 2px 0px 0px #111111;
      }
      .hard-shadow-lg {
        box-shadow: 6px 6px 0px 0px #111111;
      }
      .hard-shadow-red {
        box-shadow: 4px 4px 0px 0px #CC0000;
      }
      .hard-shadow-hover {
        transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      }
      .hard-shadow-hover:hover {
        box-shadow: 4px 4px 0px 0px #111111;
        transform: translate(-2px, -2px);
      }

      /* Newsprint line texture */
      .newsprint-texture {
        position: relative;
      }
      .newsprint-texture::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(0deg, transparent 97%, rgba(17,17,17,0.02) 100%),
          linear-gradient(90deg, transparent 97%, rgba(17,17,17,0.02) 100%);
        background-size: 4px 4px;
        pointer-events: none;
      }

      /* Newspaper double line border */
      .border-double-b {
        border-bottom: 4px double #111111;
      }
      .border-double-t {
        border-top: 4px double #111111;
      }
      .border-double-y {
        border-top: 4px double #111111;
        border-bottom: 4px double #111111;
      }

      /* Halftone simulation */
      .halftone-bg {
        background-image: radial-gradient(#111111 1px, transparent 1px);
        background-size: 8px 8px;
      }
